---
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.AlignCamelVersions
displayName: Align Camel and Kamelets dependency versions
description: Aligns Camel dependencies, plugins, parents and Kamelets to their independently configured target versions after API migrations.
recipeList:
  - org.openrewrite.maven.UpgradeDependencyVersion:
      groupId: 'org.apache.camel'
      artifactId: '*'
      newVersion: @camel-version@
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: 'org.apache.camel'
      artifactId: '*'
      newVersion: @camel-version@
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: 'org.apache.camel'
      artifactId: '*'
      newVersion: @camel-version@
  - org.openrewrite.maven.ChangePropertyValue:
      key: camel.version
      newValue: @camel-version@
  - org.openrewrite.maven.UpgradeDependencyVersion:
      groupId: org.apache.camel.kamelets
      artifactId: camel-kamelets
      newVersion: @camel-kamelets-version@
